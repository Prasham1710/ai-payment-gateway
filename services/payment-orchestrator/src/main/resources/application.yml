server:
  port: 8080

spring:
  application:
    name: payment-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6380
  task:
    scheduling:
      pool:
        # Webhook dispatcher, refund retries, automatic refunds and reconciliation run independently.
        size: 4
  jackson:
    # Razorpay-style JSON: snake_case keys, and amounts must be whole paise (50000, not 500.00).
    property-naming-strategy: SNAKE_CASE
    deserialization:
      accept-float-as-int: false

simulator:
  base-url: http://localhost:8081

gateway:
  security:
    # AES-256 key (base64, 32 bytes) that encrypts merchant key secrets and webhook secrets at rest.
    # Without GATEWAY_MASTER_KEY a publicly known development key is used and a warning is logged.
    master-key: ${GATEWAY_MASTER_KEY:insecure-dev-key}
  routing:
    providers: provider-a,provider-b,provider-c
    connect-timeout: 2s
    read-timeout: 8s
    ai:
      # AI smart routing (services/ai-router). If it is down or slow, the order above is used.
      enabled: ${GATEWAY_AI_ROUTING_ENABLED:true}
      base-url: ${GATEWAY_AI_ROUTER_URL:http://localhost:8000}
      timeout: 150ms
  pricing:
    fee-percent: 2.00
    gst-percent: 18.00
  payments:
    # Authorized payments that are not captured within this window are refunded automatically.
    capture-window: 5d
    auto-refund-poll-interval-ms: 30000
    # After an automatic refund fails (e.g. the rail stayed down), try again after this long.
    auto-refund-retry-interval: 1h
  reconciliation:
    # Payments whose bank outcome is unknown are re-checked with the bank for this long.
    window: 24h
    poll-interval-ms: 30000
  webhooks:
    # Webhook URLs on loopback/private/link-local networks are refused (SSRF protection).
    # Set GATEWAY_WEBHOOKS_ALLOW_PRIVATE_NETWORK=true to deliver to a receiver on your own machine.
    allow-private-network: ${GATEWAY_WEBHOOKS_ALLOW_PRIVATE_NETWORK:false}
    max-endpoints-per-merchant: 10
    # Outstanding deliveries per endpoint and per merchant, so a slow or dead receiver only delays its own events.
    max-in-flight-per-endpoint: 2
    max-in-flight-per-merchant: 4
    concurrency: 16
    poll-interval-ms: 1000
    max-attempts: 8
    base-backoff: 5s
    max-backoff: 1h
    timeout: 5s
  refunds:
    poll-interval-ms: 5000
    max-attempts: 10
    retry-backoff: 30s
    unconfirmed-retry-interval: 1h

resilience4j:
  circuitbreaker:
    instances:
      provider-a:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 3
      provider-b:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms
      provider-c:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms
