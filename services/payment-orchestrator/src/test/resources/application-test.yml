spring:
  datasource:
    url: jdbc:h2:mem:gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

gateway:
  # Tests drive the webhook dispatcher and refund retries directly.
  scheduling:
    enabled: false
  routing:
    read-timeout: 600ms
  webhooks:
    base-backoff: 0s
    timeout: 1s
    # The test webhook receiver runs on 127.0.0.1; the guard itself is unit tested.
    allow-private-network: true
  refunds:
    max-attempts: 2
